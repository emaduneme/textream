name: Desktop (Electron)

on:
  push:
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop.yml'
  pull_request:
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm test
      - name: End-to-end tests
        run: xvfb-run -a -s "-screen 0 1920x1080x24" npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: desktop/test-results/
          if-no-files-found: ignore

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
          - os: macos-latest
            target: --mac
          - os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - name: Build installer (unsigned)
        run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: textream-desktop-${{ runner.os }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.dmg
            desktop/dist/*.AppImage
          if-no-files-found: error

  # Put the newest installers on one Releases page with a fixed address:
  # https://github.com/<owner>/<repo>/releases/tag/desktop-latest
  release:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: textream-desktop-*
          path: installers
          merge-multiple: true
      - name: Replace the desktop-latest pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -la installers
          gh release delete desktop-latest --cleanup-tag --yes || true
          gh release create desktop-latest installers/* \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Textream Desktop (preview)" \
            --notes "Latest Windows, macOS and Linux builds of the Electron app, from ${GITHUB_REF_NAME} at ${GITHUB_SHA::7}.

          - **Windows:** download \`Textream-Setup-*.exe\` and run it. SmartScreen warns about an unsigned app: choose **More info**, then **Run anyway**.
          - **macOS (Apple silicon):** download the \`.dmg\`. The app is unsigned: if macOS blocks it, open System Settings → Privacy & Security and choose **Open Anyway**. The native Mac app from the App Store is the better choice on a Mac.
          - **Linux:** download the \`.AppImage\`, make it executable, and run it."
